name: Version Bump

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - 'README'

permissions:
  contents: read # tag push uses GH_PAT, not GITHUB_TOKEN

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Conventional-commit aware: feat → minor, fix/chore/etc → patch,
      # "BREAKING CHANGE" footer or "!" after the type → major.
      # (The previous anothrNick action only understood literal
      # #major/#minor/#patch tokens, so feat: merges were tagged as patches.)
      - name: Bump version and push tag
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GH_PAT }}
          release_branches: main
          default_bump: patch
          tag_prefix: v
