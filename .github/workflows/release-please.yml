name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GH_PAT (not GITHUB_TOKEN) so the release tag push triggers
      # release-pipeline.yml.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GH_PAT }}
