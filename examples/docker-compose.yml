---
services:
  # Zero Trust Server - Public-facing component
  zero-trust-server:
    image: ghcr.io/devhatro/zero-trust-proxy/server:latest
    container_name: zero-trust-server
    restart: unless-stopped
    ports:
      - "8443:8443"    # Agent connections (mTLS)
      - "80:80"        # HTTP (redirect + ACME HTTP-01 challenge)
      - "443:443"      # HTTPS (public traffic)
    volumes:
      - ./config:/config:ro
      - ./config/certs:/certs:ro
      # Writable ACME storage (tls.mode: acme). The /config mount above is
      # read-only, so issued certificates need their own writable volume.
      - acme-data:/config/acme
    environment:
      - LOG_LEVEL=INFO
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Zero Trust Agent - On-premises component
  zero-trust-agent:
    image: ghcr.io/devhatro/zero-trust-proxy/agent:latest
    container_name: zero-trust-agent
    restart: unless-stopped
    volumes:
      - ./config:/config:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Persistent storage for ACME-issued certificates
  acme-data:
    driver: local
